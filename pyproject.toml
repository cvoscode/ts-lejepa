[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lejepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "lightning>=2.6.0",
    "matplotlib>=3.10.7",
    "nbformat>=5.10.4",
    "plotly>=6.5.0",
    "ray[tune]>=2.9.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "tensorboardx>=2.6.4",
    "torch-geometric>=2.7.0",
    "pacmap>=0.9.1",
    "omegaconf>=2.3.1",
    "torch>=2.9.1",
    "torchvision>=0.29.0",
    "augmenttime",
    # CUDA 13 runtime libraries — these are bundled as the cu130 torch wheel
    # but the cu13 PyPI packages ship the cuDNN / NCCL / nvshmem / cusparseLt
    # shared objects that torch loads at import time. They must be declared
    # explicitly so `uv sync` does not strip them from the venv.
    "nvidia-cudnn-cu13>=9.0",
    "nvidia-cusparselt-cu13>=0.7",
    "nvidia-nccl-cu13>=2.20",
    "nvidia-nvshmem-cu13>=3.0",
    "nvidia-cublas>=13.0",
    "nvidia-cuda-nvrtc>=13.0",
]

[project.optional-dependencies]
dashboards = ["aeroboard[lightning]"]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
augmenttime = { path = "../augmenttime", editable = true }
aeroboard = { path = "../aeroboard", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/modules", "src/images", "src/timeseries"]

 [tool.uv.extra-build-dependencies]
torch-sparse = ["torch"]
torch-scatter = ["torch"]
