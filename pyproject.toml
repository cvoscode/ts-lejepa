[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lejepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "lightning>=2.6.0",
    "matplotlib>=3.10.7",
    "nbformat>=5.10.4",
    "plotly>=6.5.0",
    "ray[tune]>=2.9.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "tensorboardx>=2.6.4",
    "torch-geometric>=2.7.0",
    "pacmap>=0.9.1",
    "omegaconf>=2.3.1",
    "torch>=2.9.1",
    "torchvision>=0.29.0",
    "augmenttime",
]

[tool.uv.sources]
augmenttime = { path = "../augmenttime", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/modules", "src/images", "src/timeseries"]

 [tool.uv.extra-build-dependencies]
torch-sparse = ["torch"]
torch-scatter = ["torch"]
